<div class="pagination-wrap">
  {% if paginator.previous_page %}
    {% if paginator.previous_page == 1 %}
    <a class="newer-posts" href="{{ site.baseurl }}/"><i class="fa fa-chevron-left"></i></a>
    {% else %}
    <a class="newer-posts" href="{{ site.baseurl }}/page/{{ paginator.previous_page }}/"><i class="fa fa-chevron-left"></i></a>
    {% endif %}
  {% endif %}

  <span class="page-number">{{ paginator.page }} / {{ paginator.total_pages }}</span>

  {% if paginator.next_page %}
  <a class="older-posts" href="{{ site.baseurl }}/page/{{ paginator.next_page }}/"><i class="fa fa-chevron-right"></i></a>
  {% endif %}
</div>
