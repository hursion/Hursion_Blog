title: Hursion's Blog
description: > # this means to ignore newlines until "baseurl:"
  Android 系统开发笔记：框架、多媒体、测试认证与工具效率。
permalink: ':title/'
baseurl: "/Hursion_Blog" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
site-twitter: #if your site has a twitter account, enter it here

# Author Settings
author: Hursion Zhang # add your name
author-img: hursion_zhang.jpg # add your photo
about-author: Android 系统开发工程师，专注 App 与 Framework。记录系统源码、多媒体调试与认证测试中的点滴，保持学习，持续分享。 # add description
social-twitter: # add your Twitter handle
social-facebook: # add your Facebook handle
social-github: hursion # add your Github handle
social-linkedin: # add your Linkedin handle
social-email: zhanghursion@gmail.com # add your Email address

# Disqus
discus-identifier: mr-zhang # add your discus identifier

# Tracker
analytics: # Google Analytics

# Build Settings
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jemoji

paginate: 10
paginate_path: "/page/:num"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true

exclude: ["node_modules", "gulpfile.js", "package.json", "yarn.lock"]
